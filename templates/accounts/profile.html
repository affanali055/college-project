{% extends 'base.html' %}

{% block title %}My Profile - CoWork{% endblock %}

{% block content %}
<div class="dashboard-grid">
    <div class="glass-panel dashboard-menu">
        <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text-secondary);">ACCOUNT PANEL</h3>
        <a href="{% url 'dashboard_home' %}" class="dashboard-menu-link">
            <i class="fa-solid fa-gauge"></i> Dashboard Home
        </a>
        <a href="{% url 'profile' %}" class="dashboard-menu-link active">
            <i class="fa-solid fa-user-gear"></i> Edit Profile
        </a>
        <a href="{% url 'logout' %}" class="dashboard-menu-link" style="color: var(--danger);">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
        </a>
    </div>

    <div class="dashboard-content">
        <div class="glass-panel" style="padding: 40px;">
            <h2 style="margin-bottom: 24px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                <i class="fa-solid fa-id-card" style="color: var(--accent-primary);"></i> Edit Profile Details
            </h2>

            <form method="POST">
                {% csrf_token %}
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                    
                    <div class="form-group">
                        <label>Role</label>
                        <input type="text" class="form-control" value="{{ user.get_role_display }}" disabled style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" id="first_name" class="form-control" value="{{ user.first_name }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" id="last_name" class="form-control" value="{{ user.last_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" name="phone" id="phone" class="form-control" value="{{ user.phone|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="company_name">Company Name</label>
                        <input type="text" name="company_name" id="company_name" class="form-control" value="{{ user.company_name|default:'' }}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
                    <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
