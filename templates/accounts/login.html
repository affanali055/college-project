{% extends 'base.html' %}

{% block title %}Login - CoWork{% endblock %}

{% block content %}
<div class="glass-panel auth-container">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Access your co-working space dashboard</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
        Don't have an account? <a href="{% url 'signup' %}">Sign Up here</a>
    </div>
</div>
{% endblock %}
